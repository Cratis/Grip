name: Publish

# Never cancel a release in flight, and keep up to 100 pending Publish runs in FIFO order with
# `queue: max`: the default single pending slot drops the older pending release when a third merge
# arrives. Runs remain serialized and in-flight releases are never cancelled. `cancel-in-progress` is
# omitted because GitHub rejects it together with `queue: max`. See cratis/release-action's README
# ("Choosing a trigger") for why push is the recommended trigger.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

env:
  NUGET_OUTPUT: ./Artifacts/NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        default: "0.0.0"
        type: string
      release-notes:
        description: "Release notes"
        required: true
        default: "No release notes"
        type: string
  # Label-based releasing: merging a PR with a major/minor/patch label bumps the version and
  # publishes. cratis/release-action reads the label to compute the next semantic version. Push
  # (rather than pull_request: closed) is deliberate - a merged pull request from a fork runs with
  # a read-only GITHUB_TOKEN even on merge, so it could not create the release or push packages; a
  # push to main always carries a full-permission token, and the action finds the merged pull
  # request and its label from the commit. There is no paths filter: the merged pull request's
  # label decides whether anything is released, so a labelled pull request that only touched, say,
  # a Dockerfile still cuts its release, and a no-release one publishes nothing.
  push:
    branches:
      - main

# Nothing by default; each job asks for exactly what it needs. Only the publish-only jobs, which run
# no build or install script, hold an OIDC token.
permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Creates the tag and the GitHub release.
      contents: write
      # Reads the merged pull request and its label.
      pull-requests: read
      # Closes the issues the release notes deliver with (#n).
      issues: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Release
        id: release
        uses: cratis/release-action@26976c4c37ac8c0454077c0f41abb31650e36405 # v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  # Packing runs the build, so it holds no publishing rights: it only uploads the packages for the
  # publish job below.
  pack-nuget:
    name: Pack NuGet packages
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate the version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-version: "10.0.x"

      # Release carries none of the Debug-only specification dependencies (see Source/DotNET/Directory.Build.props).
      # Packing the solution packs every project under the same version.
      - name: Pack NuGet packages
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: >
          dotnet pack Grip.slnx
          --configuration Release
          "-p:Version=$VERSION"
          -o "$NUGET_OUTPUT"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: ${{ env.NUGET_OUTPUT }}/*.nupkg
          if-no-files-found: error
          retention-days: 7

  # Every Cratis.Grip.* package via NuGet.org trusted publishing (OIDC) - no long-lived API key secret to hold or
  # rotate. The trusted-publishing policy on nuget.org is bound to this workflow file (publish.yml) by name, so the job
  # must live here rather than in a separately named workflow. It checks out and builds nothing: it pushes what
  # pack-nuget packed.
  publish-nuget:
    name: Push NuGet packages
    needs: [release, pack-nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required for NuGet trusted publishing using OIDC tokens.
      id-token: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: ${{ env.NUGET_OUTPUT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "11.0.x"

      # Get a short-lived NuGet API key.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push --skip-duplicate "$NUGET_OUTPUT/*.nupkg" --timeout 900 --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  # The builder images on Docker Hub at the release version, and `latest` unless it is a prerelease. The images keep
  # their names (cratis/builder, cratis/studio-axon-builder, cratis/studio-eventmodelers-builder), because the Cratis CLI
  # picks them by name and the newest version. They are published for amd64 and arm64 like the Stage image: the
  # builders run on developers' machines, Apple Silicon included, and nothing in them is compiled, so the arm64 leg
  # under emulation only installs packages. cratis/builder installs the latest released Cratis CLI (--no-cache, so a
  # cached layer never ships an older one); the Axon and Eventmodelers builders are built FROM it, at the same version.
  publish-images:
    name: Push the builder images
    needs: [release]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the builder images
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          build() {
            local image="$1"; shift
            local tags=("$image:$VERSION")
            if [ "$PRERELEASE" != "true" ]; then
              tags+=("$image:latest")
            fi
            echo "::group::build $image"
            docker buildx build --builder "$BUILDER" --platform linux/amd64,linux/arm64 \
              --provenance=false --sbom=false --push \
              --build-arg "BUILDER_VERSION=$VERSION" "${tags[@]/#/--tag=}" "$@" .
            echo "::endgroup::"
          }
          build cratis/builder --pull --no-cache --file Docker/cratis/Dockerfile
          build cratis/studio-axon-builder --pull --file Docker/axon/Dockerfile
          build cratis/studio-eventmodelers-builder --pull --file Docker/eventmodelers/Dockerfile

  # A merged pull request that publishes nothing is the failure mode that silently costs a release:
  # the release job succeeds, every publish job is skipped for want of should-publish, and the
  # whole run reports green. Fail instead, so a release that did not happen cannot be mistaken for
  # one that did. Only for the reasons that mean something went wrong - publishing nothing is
  # correct and routine for the others, such as a commit pushed straight to main or a re-run of a
  # run that already released. See cratis/release-action's README, "Acting on the reason".
  verify-published:
    name: Verify a release was actually published
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}

    steps:
      - name: Report that nothing was published
        env:
          REASON: ${{ needs.release.outputs.reason }}
        run: |
          echo "::error::Nothing was published and no release was cut (reason: $REASON). Add exactly one of major, minor, patch or no-release to the merged pull request and re-run this workflow - see verify-pull-request-policy, which is meant to catch this before the merge."
          exit 1
